name: Deploy to Dev

on:
  push:
    branches: [ develop ]

env:
  AWS_REGION: eu-west-1
  CLUSTER_NAME: fintech-fraud-detection-cluster
  NAMESPACE: dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      contents: read
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.CLUSTER_NAME }}
    
    - name: Set up Helm
      uses: azure/setup-helm@v3
      with:
        version: 'v3.12.0'
    
    - name: Deploy with Helm
      run: |
        helm upgrade --install fintech-app kubernetes/helm/fintech-app \
          --namespace ${{ env.NAMESPACE }} \
          --create-namespace \
          -f kubernetes/helm/fintech-app/values.yaml \
          --set image.tag=${{ github.sha }} \
          --wait \
          --timeout 5m
    
    - name: Wait for deployment
      run: |
        kubectl rollout status deployment/fintech-app-api -n ${{ env.NAMESPACE }} --timeout=5m
        kubectl rollout status deployment/fintech-app-workers -n ${{ env.NAMESPACE }} --timeout=5m
    
    - name: Run smoke tests
      run: |
        # Get the load balancer endpoint
        LB_ENDPOINT=$(kubectl get svc -n ${{ env.NAMESPACE }} -o jsonpath='{.items[0].status.loadBalancer.ingress[0].hostname}')
        
        # Wait for the endpoint to be ready
        for i in {1..30}; do
          if curl -f http://$LB_ENDPOINT/health; then
            echo "Application is healthy"
            exit 0
          fi
          echo "Waiting for application to be ready... ($i/30)"
          sleep 10
        done
        
        echo "Application failed to become healthy"
        exit 1
    
    - name: Notify Slack on success
      if: success()
      uses: slackapi/slack-github-action@v1.24.0
      with:
        webhook-url: ${{ secrets.SLACK_WEBHOOK }}
        payload: |
          {
            "text": "✅ Dev deployment successful",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Dev Deployment Successful*\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}"
                }
              }
            ]
          }
    
    - name: Notify Slack on failure
      if: failure()
      uses: slackapi/slack-github-action@v1.24.0
      with:
        webhook-url: ${{ secrets.SLACK_WEBHOOK }}
        payload: |
          {
            "text": "❌ Dev deployment failed",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Dev Deployment Failed*\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}"
                }
              }
            ]
          }
name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to deploy (e.g., v1.0.0)'
        required: true
        type: string

env:
  AWS_REGION: eu-west-1
  CLUSTER_NAME: fintech-fraud-detection-cluster
  NAMESPACE: production

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    environment:
      name: production
      url: https://api.fintech-prod.com
    
    permissions:
      id-token: write
      contents: read
    
    steps:
    - uses: actions/checkout@v3
      with:
        ref: ${{ github.event.inputs.version }}
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.CLUSTER_NAME }}
    
    - name: Set up Helm
      uses: azure/setup-helm@v3
      with:
        version: 'v3.12.0'
    
    - name: Create backup of current deployment
      run: |
        kubectl get all -n ${{ env.NAMESPACE }} -o yaml > /tmp/backup-${{ github.event.inputs.version }}.yaml
        echo "Backup created at /tmp/backup-${{ github.event.inputs.version }}.yaml"
    
    - name: Deploy with Helm (Blue-Green)
      run: |
        helm upgrade --install fintech-app kubernetes/helm/fintech-app \
          --namespace ${{ env.NAMESPACE }} \
          --create-namespace \
          -f kubernetes/helm/fintech-app/values.yaml \
          -f kubernetes/helm/fintech-app/values-prod.yaml \
          --set image.tag=${{ github.event.inputs.version }} \
          --wait \
          --timeout 10m
    
    - name: Wait for deployment
      run: |
        kubectl rollout status deployment/fintech-app-api -n ${{ env.NAMESPACE }} --timeout=10m
        kubectl rollout status deployment/fintech-app-workers -n ${{ env.NAMESPACE }} --timeout=10m
    
    - name: Health check
      run: |
        # Get the load balancer endpoint
        LB_ENDPOINT=$(kubectl get svc -n ${{ env.NAMESPACE }} -o jsonpath='{.items[0].status.loadBalancer.ingress[0].hostname}')
        
        echo "Testing health endpoint: $LB_ENDPOINT"
        
        for i in {1..60}; do
          if curl -f http://$LB_ENDPOINT/health; then
            echo "✅ Application is healthy"
            exit 0
          fi
          echo "Waiting for application... ($i/60)"
          sleep 5
        done
        
        echo "❌ Application health check failed"
        exit 1
    
    - name: Run smoke tests
      run: |
        LB_ENDPOINT=$(kubectl get svc -n ${{ env.NAMESPACE }} -o jsonpath='{.items[0].status.loadBalancer.ingress[0].hostname}')
        
        # Test API endpoints
        echo "Testing /health endpoint..."
        curl -f http://$LB_ENDPOINT/health || exit 1
        
        echo "Testing /api/transactions endpoint..."
        curl -f http://$LB_ENDPOINT/api/transactions -X OPTIONS || exit 1
        
        echo "✅ All smoke tests passed"
    
    - name: Rollback on failure
      if: failure()
      run: |
        echo "🔄 Rolling back to previous deployment..."
        helm rollback fintech-app -n ${{ env.NAMESPACE }}
        kubectl rollout status deployment/fintech-app-api -n ${{ env.NAMESPACE }} --timeout=5m
    
    - name: Notify Slack on success
      if: success()
      uses: slackapi/slack-github-action@v1.24.0
      with:
        webhook-url: ${{ secrets.SLACK_WEBHOOK }}
        payload: |
          {
            "text": "✅ Production deployment successful",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Production Deployment Successful*\nVersion: ${{ github.event.inputs.version }}\nURL: https://api.fintech-prod.com"
                }
              }
            ]
          }
    
    - name: Notify Slack on failure
      if: failure()
      uses: slackapi/slack-github-action@v1.24.0
      with:
        webhook-url: ${{ secrets.SLACK_WEBHOOK }}
        payload: |
          {
            "text": "❌ Production deployment failed",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Production Deployment Failed*\nVersion: ${{ github.event.inputs.version }}\nAction: Rollback executed"
                }
              }
            ]
          }
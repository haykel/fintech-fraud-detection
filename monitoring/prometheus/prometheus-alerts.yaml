# Prometheus Alert Rules for FinTech Fraud Detection

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: fintech-fraud-detection-alerts
  namespace: monitoring
spec:
  groups:
  # API Alerts
  - name: api.rules
    interval: 30s
    rules:
    - alert: HighErrorRate
      expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "High error rate detected"
        description: "Error rate is {{ $value | humanizePercentage }} on {{ $labels.instance }}"
    
    - alert: HighResponseTime
      expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High response time"
        description: "P95 response time is {{ $value }}s on {{ $labels.instance }}"
    
    - alert: PodCrashLooping
      expr: rate(kube_pod_container_status_restarts_total[5m]) > 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Pod is crash looping"
        description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is crash looping"
    
    - alert: HighMemoryUsage
      expr: (container_memory_usage_bytes{pod=~"fintech-app.*"} / container_spec_memory_limit_bytes) > 0.9
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High memory usage"
        description: "Memory usage is {{ $value | humanizePercentage }} on {{ $labels.pod }}"
    
    - alert: HighCPUUsage
      expr: (rate(container_cpu_usage_seconds_total{pod=~"fintech-app.*"}[5m]) * 100) > 80
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High CPU usage"
        description: "CPU usage is {{ $value }}% on {{ $labels.pod }}"

  # Database Alerts
  - name: database.rules
    interval: 30s
    rules:
    - alert: DatabaseConnectionPoolExhausted
      expr: pg_stat_activity_count > 90
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Database connection pool exhausted"
        description: "Database has {{ $value }} active connections (limit: 100)"
    
    - alert: DatabaseHighQueryTime
      expr: pg_slow_queries > 10
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High number of slow queries"
        description: "{{ $value }} slow queries detected in the last 5 minutes"
    
    - alert: DatabaseDiskUsageHigh
      expr: (pg_database_size_bytes / 1024 / 1024 / 1024) > 50
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Database disk usage high"
        description: "Database size is {{ $value }}GB"

  # Redis Alerts
  - name: redis.rules
    interval: 30s
    rules:
    - alert: RedisHighMemoryUsage
      expr: (redis_memory_used_bytes / redis_memory_max_bytes) > 0.9
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Redis memory usage high"
        description: "Redis memory usage is {{ $value | humanizePercentage }}"
    
    - alert: RedisEvictions
      expr: rate(redis_evicted_keys_total[5m]) > 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Redis is evicting keys"
        description: "Redis is evicting {{ $value }} keys per second"
    
    - alert: RedisHighCPU
      expr: redis_cpu_user_seconds_total > 50
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Redis CPU usage high"
        description: "Redis CPU usage is high"

  # Fraud Detection Alerts
  - name: fraud_detection.rules
    interval: 30s
    rules:
    - alert: FraudDetectionLatencyHigh
      expr: histogram_quantile(0.95, rate(fraud_detection_duration_seconds_bucket[5m])) > 2
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Fraud detection latency is high"
        description: "P95 fraud detection latency is {{ $value }}s"
    
    - alert: FraudDetectionAccuracyLow
      expr: fraud_detection_accuracy < 0.8
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Fraud detection accuracy is low"
        description: "Fraud detection accuracy is {{ $value | humanizePercentage }}"
    
    - alert: KafkaConsumerLagHigh
      expr: kafka_consumer_lag > 1000
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Kafka consumer lag is high"
        description: "Consumer lag is {{ $value }} messages"
    
    - alert: TransactionProcessingErrors
      expr: rate(fraud_detection_errors_total[5m]) > 0.01
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High transaction processing error rate"
        description: "Error rate is {{ $value | humanizePercentage }}"

  # Kubernetes Alerts
  - name: kubernetes.rules
    interval: 30s
    rules:
    - alert: KubernetesNodeNotReady
      expr: kube_node_status_condition{condition="Ready",status="true"} == 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Kubernetes node not ready"
        description: "Node {{ $labels.node }} is not ready"
    
    - alert: KubernetesPersistentVolumeUsageHigh
      expr: (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) > 0.9
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Kubernetes persistent volume usage high"
        description: "Volume {{ $labels.persistentvolumeclaim }} usage is {{ $value | humanizePercentage }}"
    
    - alert: KubernetesContainerOomKiller
      expr: kube_pod_container_status_terminated_reason{reason="OOMKilled"} == 1
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Kubernetes container OOM killer triggered"
        description: "Container {{ $labels.container }} in pod {{ $labels.pod }} was OOMKilled"

  # Infrastructure Alerts
  - name: infrastructure.rules
    interval: 30s
    rules:
    - alert: NodeDiskPressure
      expr: kube_node_status_condition{condition="DiskPressure",status="true"} == 1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Node disk pressure"
        description: "Node {{ $labels.node }} has disk pressure"
    
    - alert: NodeMemoryPressure
      expr: kube_node_status_condition{condition="MemoryPressure",status="true"} == 1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Node memory pressure"
        description: "Node {{ $labels.node }} has memory pressure"
    
    - alert: InstanceDown
      expr: up{job="fintech-app"} == 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Instance is down"
        description: "Instance {{ $labels.instance }} is down"
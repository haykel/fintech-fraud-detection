apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fintech-app.fullname" . }}-api
  labels:
    {{- include "fintech-app.labels" . | nindent 4 }}
    component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "fintech-app.selectorLabels" . | nindent 6 }}
      component: api
  template:
    metadata:
      labels:
        {{- include "fintech-app.selectorLabels" . | nindent 8 }}
        component: api
    spec:
      serviceAccountName: {{ include "fintech-app.serviceAccountName" . }}
      containers:
      - name: api
        image: "{{ .Values.global.imageRegistry }}/{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
        imagePullPolicy: {{ .Values.api.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.api.service.targetPort }}
          protocol: TCP
        env:
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: {{ include "fintech-app.fullname" . }}
              key: ENVIRONMENT
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: {{ include "fintech-app.fullname" . }}
              key: LOG_LEVEL
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "fintech-app.fullname" . }}
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "fintech-app.fullname" . }}
              key: REDIS_URL
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: {{ include "fintech-app.fullname" . }}
              key: KAFKA_BOOTSTRAP_SERVERS
        - name: MISTRAL_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "fintech-app.fullname" . }}
              key: MISTRAL_API_KEY
        livenessProbe:
          httpGet:
            path: {{ .Values.api.healthCheck.path }}
            port: http
          initialDelaySeconds: {{ .Values.api.healthCheck.initialDelaySeconds }}
          periodSeconds: {{ .Values.api.healthCheck.periodSeconds }}
        readinessProbe:
          httpGet:
            path: {{ .Values.api.healthCheck.path }}
            port: http
          initialDelaySeconds: {{ .Values.api.healthCheck.initialDelaySeconds }}
          periodSeconds: {{ .Values.api.healthCheck.periodSeconds }}
        resources:
          {{- toYaml .Values.api.resources | nindent 12 }}
